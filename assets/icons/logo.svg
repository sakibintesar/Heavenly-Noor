<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Heavenly Noor — neobrutalist flower mark -->
  <g stroke="#1C1B18" stroke-width="4">
    <!-- 8 petals -->
    <ellipse cx="50" cy="22" rx="11" ry="16" fill="#EFC9D4"/>
    <ellipse cx="50" cy="78" rx="11" ry="16" fill="#EFC9D4"/>
    <ellipse cx="22" cy="50" rx="16" ry="11" fill="#F2D98D"/>
    <ellipse cx="78" cy="50" rx="16" ry="11" fill="#F2D98D"/>
    <ellipse cx="30" cy="30" rx="11" ry="14" fill="#EFC9D4" transform="rotate(-45 30 30)"/>
    <ellipse cx="70" cy="30" rx="11" ry="14" fill="#EFC9D4" transform="rotate(45 70 30)"/>
    <ellipse cx="30" cy="70" rx="11" ry="14" fill="#EFC9D4" transform="rotate(45 30 70)"/>
    <ellipse cx="70" cy="70" rx="11" ry="14" fill="#EFC9D4" transform="rotate(-45 70 70)"/>
    <!-- center -->
    <circle cx="50" cy="50" r="14" fill="#C96F5A"/>
  </g>
  <!-- "HN" in center -->
  <text x="50" y="56" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="#F7F2EA" text-anchor="middle">HN</text>
</svg>
